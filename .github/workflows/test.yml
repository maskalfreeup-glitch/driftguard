name: Chaos Acceptance Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  chaos-benchmark:
    name: Deterministic Chaos Acceptance Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run Go Unit Tests
        run: |
          go test -v ./...

      - name: Run Deterministic Chaos Benchmark
        run: |
          make test-chaos
