global
    log stdout format raw local0 info
    maxconn 4096
    stats socket /var/run/haproxy/admin.sock mode 666 level admin

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  30000ms
    timeout server  30000ms
    timeout http-request 10000ms
    timeout http-keep-alive 5000ms
    default-server init-addr libc,none

frontend rpc_ingress
    bind *:8545
    mode http
    option http-buffer-request

    acl is_write_tx req.body -m sub eth_sendRawTransaction

    acl path_eth  path_beg -i /eth
    acl path_base path_beg -i /base
    acl path_arb  path_beg -i /arb
    acl path_nova path_beg -i /nova

    use_backend ofa_eth_relay  if path_eth is_write_tx
    use_backend ofa_base_relay if path_base is_write_tx
    use_backend ofa_arb_relay  if path_arb is_write_tx
    use_backend ofa_arb_relay  if path_nova is_write_tx

    use_backend eth_read_pool  if path_eth
    use_backend base_read_pool if path_base
    use_backend nova_read_pool if path_nova
    default_backend nitro_read_cluster

backend ofa_eth_relay
    mode http
    http-request set-uri "/?refund=${OFA_PAYOUT_ADDRESS}:10"
    http-request set-header Host rpc.flashbots.net
    server flashbots rpc.flashbots.net:443 ssl verify none check check-sni rpc.flashbots.net sni str(rpc.flashbots.net) inter 5000ms

backend ofa_arb_relay
    mode http
    http-request set-path /
    http-request set-header Host relay.mevblocker.io
    server mevblocker relay.mevblocker.io:443 ssl verify none check check-sni relay.mevblocker.io sni str(relay.mevblocker.io) inter 5000ms

backend ofa_base_relay
    mode http
    http-request set-path /
    http-request set-header Host relay.mevblocker.io
    server mevblocker relay.mevblocker.io:443 ssl verify none check check-sni relay.mevblocker.io sni str(relay.mevblocker.io) inter 5000ms

backend ofa_monetization_relay
    mode http
    http-request set-path /
    http-request set-header Host relay.mevblocker.io
    server mevblocker relay.mevblocker.io:443 ssl verify none check check-sni relay.mevblocker.io sni str(relay.mevblocker.io) inter 5000ms

backend eth_read_pool
    mode http
    http-request set-path /
    http-request set-header Host ethereum-sepolia-rpc.publicnode.com
    server eth_primary ethereum-sepolia-rpc.publicnode.com:443 ssl verify none check check-sni ethereum-sepolia-rpc.publicnode.com sni str(ethereum-sepolia-rpc.publicnode.com) inter 5000ms

backend base_read_pool
    mode http
    http-request set-path /
    http-request set-header Host mainnet.base.org
    server base_primary mainnet.base.org:443 ssl verify none check check-sni mainnet.base.org sni str(mainnet.base.org) inter 5000ms

backend nova_read_pool
    mode http
    http-request set-path /rpc
    http-request set-header Host nova.arbitrum.io
    server nova_primary nova.arbitrum.io:443 ssl verify none check check-sni nova.arbitrum.io sni str(nova.arbitrum.io) inter 5000ms

backend nitro_read_cluster
    mode http
    http-request set-path /rpc
    http-request set-header Host arb1.arbitrum.io
    server nitro_primary arb1.arbitrum.io:443 ssl verify none check check-sni arb1.arbitrum.io sni str(arb1.arbitrum.io) inter 5000ms
    server nitro_fallback arbitrum-one-rpc.publicnode.com:443 ssl verify none check check-sni arbitrum-one-rpc.publicnode.com sni str(arbitrum-one-rpc.publicnode.com) backup inter 5000ms
