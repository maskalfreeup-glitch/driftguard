global
    log stdout format raw local0 info
    maxconn 4096
    stats socket /var/run/haproxy/admin.sock mode 666 level admin
    stats timeout 30s

defaults
    log     global
    mode    http
    option  dontlognull
    timeout connect 2000ms
    timeout client  5000ms
    timeout server  5000ms

frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 1s

frontend fe_eth_rpc
    bind *:8545
    default_backend be_nitro

backend be_nitro
    mode http
    balance roundrobin
    http-response set-header X-Upstream %[srv_name]
    option httpchk POST / "{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}"
    http-check send meth POST uri / ver HTTP/1.1 hdr Content-Type application/json body "{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}"
    http-check expect status 200
    server local local-nitro-node:8545 check inter 500ms fall 2 rise 2
    server fallback fallback-nitro-node:8545 check backup inter 500ms fall 2 rise 2
