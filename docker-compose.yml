x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7-alpine
    container_name: driftguard-redis
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 32m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
      --maxmemory 20mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    volumes:
      - redis_data:/data
    networks:
      - driftguard_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 32M

  sentinel:
    build:
      context: .
      dockerfile: sentinel/Dockerfile
    container_name: driftguard-sentinel
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0"
      HAPROXY_SOCKET_PATH: /run/haproxy/admin.sock
      CHAINS_CONFIG_PATH: /app/sentinel/config/chains.yaml
    volumes:
      - ./sentinel/config/chains.yaml:/app/sentinel/config/chains.yaml:ro
      - haproxy_socket:/run/haproxy
    networks:
      - driftguard_net
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  proxy:
    image: haproxy:2.8-alpine
    container_name: driftguard-proxy
    user: root
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m
    depends_on:
      sentinel:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - GATEWAY_PORT=${GATEWAY_PORT:-8545}
      - HAPROXY_STATS_PORT=${HAPROXY_STATS_PORT:-8404}
      - STATS_USER=${STATS_USER:-admin}
      - STATS_PASSWORD=${STATS_PASSWORD:?Set STATS_PASSWORD in .env}
      - PRIMARY_RPC_HOST=${PRIMARY_RPC_HOST:-ethereum-sepolia-rpc.publicnode.com}
      - PRIMARY_RPC_PORT=${PRIMARY_RPC_PORT:-443}
      - PRIMARY_RPC_PATH=${PRIMARY_RPC_PATH:-/}
      - FALLBACK_RPC_HOST=${FALLBACK_RPC_HOST:-sepolia.gateway.tenderly.co}
      - FALLBACK_RPC_PORT=${FALLBACK_RPC_PORT:-443}
      - FALLBACK_RPC_PATH=${FALLBACK_RPC_PATH:-/}
      - RATE_LIMIT_PER_10S=${RATE_LIMIT_PER_10S:-200}
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8545}:${GATEWAY_PORT:-8545}"
      - "127.0.0.1:${HAPROXY_STATS_PORT:-8404}:${HAPROXY_STATS_PORT:-8404}"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - haproxy_socket:/run/haproxy
    networks:
      - driftguard_net
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 $${GATEWAY_PORT:-8545} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 64M

networks:
  driftguard_net:
    driver: bridge

volumes:
  redis_data:
  haproxy_socket:
