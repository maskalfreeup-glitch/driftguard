services:
  redis:
    image: redis:7-alpine
    container_name: driftguard-redis
    restart: unless-stopped
    mem_limit: 32m
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:-driftguard_redis_secure_pass}"
      --maxmemory 24mb
      --maxmemory-policy volatile-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - driftguard_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-driftguard_redis_secure_pass}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 32M

  sentinel:
    build:
      context: .
      dockerfile: sentinel/Dockerfile
    container_name: driftguard-sentinel
    restart: unless-stopped
    mem_limit: 48m
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - driftguard_net
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 48M

  haproxy:
    image: haproxy:2.8-alpine
    container_name: driftguard-proxy
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      sentinel:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - GATEWAY_PORT=${GATEWAY_PORT:-8545}
      - HAPROXY_STATS_PORT=${HAPROXY_STATS_PORT:-8404}
      - STATS_USER=${STATS_USER:-admin}
      - STATS_PASSWORD=${STATS_PASSWORD:-driftguard_admin_secure_pass}
      - PRIMARY_RPC_HOST=${PRIMARY_RPC_HOST:-ethereum-sepolia-rpc.publicnode.com}
      - PRIMARY_RPC_PORT=${PRIMARY_RPC_PORT:-443}
      - FALLBACK_RPC_HOST=${FALLBACK_RPC_HOST:-sepolia.gateway.tenderly.co}
      - FALLBACK_RPC_PORT=${FALLBACK_RPC_PORT:-443}
      - RATE_LIMIT_PER_10S=${RATE_LIMIT_PER_10S:-200}
    ports:
      - "${GATEWAY_PORT:-8545}:${GATEWAY_PORT:-8545}"
      - "127.0.0.1:${HAPROXY_STATS_PORT:-8404}:${HAPROXY_STATS_PORT:-8404}"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - driftguard_net
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 $${GATEWAY_PORT:-8545} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 64M

networks:
  driftguard_net:
    driver: bridge

volumes:
  redis_data:
