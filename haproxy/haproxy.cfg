global
    log stdout format raw local0 info
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s

frontend evm_inbound
    bind *:8545
    acl is_get method GET
    http-request return status 200 content-type text/html lf-string "<!doctype html><html><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>DriftGuard RPC Gateway</title><style>body{margin:0;background:#0b1020;color:#e5e7eb;font:16px system-ui,sans-serif;display:grid;min-height:100vh;place-items:center}.card{padding:2.5rem;border:1px solid #26324b;border-radius:1rem;background:#111a2e;max-width:38rem}h1{margin-top:0;color:#7dd3fc}.status{color:#86efac;font-weight:700}small{color:#9ca3af}</style></head><body><main class=card><h1>DriftGuard RPC Gateway</h1><p>High-Availability Active-Passive Failover Ingress for EVM Networks</p><p class=status>● SYSTEM OPERATIONAL</p><p>Target Network: <strong>Ethereum Sepolia (11155111)</strong></p><small>JSON-RPC requests are accepted at this endpoint.</small></main></body></html>" if is_get
    default_backend evm_primary_pool

backend evm_primary_pool
    mode http
    balance roundrobin
    http-send-name-header Host
    server ethereum-sepolia-rpc.publicnode.com ethereum-sepolia-rpc.publicnode.com:443 ssl verify none sni str(ethereum-sepolia-rpc.publicnode.com) alpn http/1.1 check check-ssl check-sni ethereum-sepolia-rpc.publicnode.com check-alpn http/1.1 inter 5s rise 2 fall 3
    server rpc.sepolia.ethpandaops.io rpc.sepolia.ethpandaops.io:443 ssl verify none sni str(rpc.sepolia.ethpandaops.io) alpn http/1.1 check check-ssl check-sni rpc.sepolia.ethpandaops.io check-alpn http/1.1 backup inter 5s rise 2 fall 3
