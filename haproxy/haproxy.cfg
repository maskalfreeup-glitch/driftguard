global
    log stdout format raw local0 info
    maxconn 4096
    user haproxy
    group haproxy
    stats socket /tmp/haproxy.sock mode 660 level admin
    tune.ssl.default-dh-param 2048

# Dynamic Docker DNS resolver for runtime container discovery
resolvers docker_dns
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold other 30s

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  http-server-close
    option  forwardfor
    timeout connect 5000ms
    timeout client  30000ms
    timeout server  30000ms
    timeout http-request 10000ms
    timeout http-keep-alive 5000ms

# --- HAProxy Observability & Prometheus Metrics ---
frontend stats_and_metrics
    bind *:8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 5s
    stats auth "${STATS_USER}:${STATS_PASSWORD}"

# --- Inbound EVM JSON-RPC Gateway ---
frontend evm_gateway
    bind *:8545

    # 1. Anti-Abuse Rate Limiting (Track per-IP request rate)
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    tcp-request connection track-sc0 src

    # 2. CORS Preflight & Response Headers
    http-response set-header Access-Control-Allow-Origin "*"
    http-response set-header Access-Control-Allow-Methods "POST, OPTIONS, GET"
    http-response set-header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization"
    
    acl is_options method OPTIONS
    http-request return status 204 if is_options

    # 3. Informational Landing Page for Browser GET requests
    acl is_get method GET
    http-request return status 200 content-type text/html lf-string "<!doctype html><html><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>DriftGuard RPC Gateway</title><style>body{margin:0;background:#0b1020;color:#e5e7eb;font:16px system-ui,sans-serif;display:grid;min-height:100vh;place-items:center}.card{padding:2.5rem;border:1px solid #26324b;border-radius:1rem;background:#111a2e;max-width:38rem}h1{margin-top:0;color:#7dd3fc}.status{color:#86efac;font-weight:700}small{color:#9ca3af}</style></head><body><main class=card><h1>DriftGuard RPC Gateway</h1><p>High-Availability Active-Passive Failover Ingress for EVM Networks</p><p class=status>● SYSTEM OPERATIONAL</p><p>Target Network: <strong>Ethereum Sepolia (11155111)</strong></p><small>JSON-RPC requests are accepted at this endpoint via HTTP POST.</small></main></body></html>" if is_get

    # 4. Strict Method Whitelist (Only POST and OPTIONS allowed for RPC)
    acl is_post method POST
    http-request deny deny_status 405 if !is_post

    # 5. Payload Guard (Reject oversized requests > 2MB)
    acl body_too_large req.body_size gt 2097152
    http-request deny deny_status 413 content-type application/json string '{"jsonrpc":"2.0","error":{"code":-32600,"message":"Payload exceeds 2MB limit"},"id":null}' if body_too_large

    # 6. Rate Limit Enforcement
    acl rate_abuser sc0_http_req_rate gt "${RATE_LIMIT_PER_10S}"
    http-request deny deny_status 429 content-type application/json string '{"jsonrpc":"2.0","error":{"code":-32005,"message":"Rate limit exceeded. Try again shortly."},"id":null}' if rate_abuser

    # 7. Dynamic Routing & Automatic Failover
    use_backend primary_pool if { nbsrv(primary_pool) gt 0 }
    default_backend backup_pool

# --- Primary RPC Pool (Monitored via Sentinel /healthz/primary) ---
backend primary_pool
    mode http
    balance roundrobin
    http-reuse aggressive

    # Dynamic host header rewriting per-upstream provider
    http-request set-header Host "${PRIMARY_RPC_HOST}"

    # Sentinel Health Probe
    option httpchk GET /healthz/primary
    http-check expect status 200

    server primary "${PRIMARY_RPC_HOST}:${PRIMARY_RPC_PORT}" resolvers docker_dns resolve-prefer ipv4 ssl verify required ca-file /etc/ssl/certs/ca-certificates.crt sni str("${PRIMARY_RPC_HOST}") alpn http/1.1 check no-check-ssl addr sentinel port 8000 inter 3s fastinter 1s fall 2 rise 2

# --- Backup RPC Pool (Monitored via Sentinel /healthz/backup) ---
backend backup_pool
    mode http
    balance roundrobin
    http-reuse aggressive

    # Dynamic host header rewriting per-upstream provider
    http-request set-header Host "${BACKUP_RPC_HOST}"

    # Sentinel Health Probe
    option httpchk GET /healthz/backup
    http-check expect status 200

    server backup "${BACKUP_RPC_HOST}:${BACKUP_RPC_PORT}" resolvers docker_dns resolve-prefer ipv4 ssl verify required ca-file /etc/ssl/certs/ca-certificates.crt sni str("${BACKUP_RPC_HOST}") alpn http/1.1 check no-check-ssl addr sentinel port 8000 inter 3s fastinter 1s fall 2 rise 2
