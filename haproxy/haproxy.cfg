global
    log stdout format raw local0 info
    maxconn 4096
    user haproxy
    group haproxy
    stats socket /run/haproxy/admin.sock mode 666 level admin
    tune.ssl.default-dh-param 2048

# Dynamic Docker DNS resolver for runtime container discovery
resolvers docker_dns
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold other 30s

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  http-server-close
    option  forwardfor
    compression algo gzip
    compression type application/json text/plain text/html
    timeout connect 5000ms
    timeout client  30000ms
    timeout server  30000ms
    timeout http-request 10000ms
    timeout http-keep-alive 5000ms
    default-server init-addr libc,none

# --- HAProxy Observability & Prometheus Metrics ---
frontend stats_and_metrics
    bind *:"${HAPROXY_STATS_PORT}"
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 5s
    stats auth "${STATS_USER}:${STATS_PASSWORD}"

# --- Inbound Multi-Chain EVM JSON-RPC Gateway ---
frontend fe_eth_rpc
    bind *:"${GATEWAY_PORT}"


    # 1. Anti-Abuse Rate Limiting (Track per-IP request rate, prioritizing edge proxy headers)
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 req.hdr_ip(CF-Connecting-IP) if { req.hdr(CF-Connecting-IP) -m found }
    http-request track-sc0 req.hdr_ip(X-Forwarded-For) if !{ req.hdr(CF-Connecting-IP) -m found } { req.hdr(X-Forwarded-For) -m found }
    http-request track-sc0 src if !{ req.hdr(CF-Connecting-IP) -m found } !{ req.hdr(X-Forwarded-For) -m found }

    # 2. CORS Preflight & Response Headers
    http-response set-header Access-Control-Allow-Origin "https://driftguard.live"
    http-response set-header Access-Control-Allow-Methods "POST, OPTIONS, GET"
    http-response set-header Access-Control-Allow-Headers "Content-Type"
    http-response set-header X-DriftGuard-Gateway "HAProxy-L7"

    http-after-response set-header Access-Control-Allow-Origin "https://driftguard.live"
    http-after-response set-header Access-Control-Allow-Methods "POST, OPTIONS, GET"
    http-after-response set-header Access-Control-Allow-Headers "Content-Type"
    http-after-response set-header X-DriftGuard-Gateway "HAProxy-L7"
    
    acl is_options method OPTIONS
    http-request return status 204 hdr Access-Control-Allow-Origin "https://driftguard.live" hdr Access-Control-Allow-Methods "POST, OPTIONS, GET" hdr Access-Control-Allow-Headers "Content-Type" if is_options

    # 3. Informational Landing Page for Browser GET requests
    acl is_sentinel    path -m str /healthz || path_beg /healthz/ || path -m str /status || path_beg /status/
    acl is_get method GET
    http-request return status 200 content-type text/html lf-string "<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>DriftGuard | Arbitrum Nitro Ingress Gateway</title><style>*{box-sizing:border-box}body{margin:0;padding:2rem 1rem;background:#080c14;background-image:radial-gradient(circle at 50%% 0%%,rgba(40,160,240,0.18) 0%%,transparent 60%%);color:#f1f5f9;font-family:system-ui,-apple-system,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}.card{width:100%%;max-width:540px;background:#0d1526;border:1px solid rgba(40,160,240,0.25);border-radius:1rem;padding:2rem;box-shadow:0 0 50px -10px rgba(40,160,240,0.2);text-align:center}.logo-wrap{display:flex;justify-content:center;margin-bottom:1rem}.badge{display:inline-block;padding:0.25rem 0.65rem;border-radius:9999px;font-size:0.75rem;font-family:monospace;background:rgba(40,160,240,0.12);border:1px solid rgba(40,160,240,0.3);color:#28a0f0;margin-bottom:0.75rem}h1{margin:0 0 0.5rem;font-size:1.5rem;font-weight:700;color:#fff;letter-spacing:-0.02em}.status{display:inline-flex;align-items:center;gap:0.4rem;font-size:0.75rem;font-family:monospace;color:#28a0f0;font-weight:600;margin-bottom:1.5rem;padding:0.2rem 0.6rem;background:rgba(40,160,240,0.08);border-radius:4px}.pulse{width:6px;height:6px;border-radius:50%%;background:#28a0f0;box-shadow:0 0 8px #28a0f0}.paths{display:grid;gap:0.5rem;text-align:left;margin-bottom:1.5rem}.path-row{display:flex;justify-content:space-between;align-items:center;padding:0.6rem 0.8rem;background:#090d16;border:1px solid rgba(255,255,255,0.06);border-radius:0.5rem;font-size:0.8rem}.path-code{font-family:monospace;color:#38bdf8;font-weight:600}.path-desc{color:#94a3b8;font-size:0.75rem}.actions{display:flex;gap:0.75rem;justify-content:center}.btn-primary{flex:1;padding:0.65rem 1rem;background:#28a0f0;color:#fff;font-weight:600;text-decoration:none;border-radius:0.5rem;font-size:0.85rem;box-shadow:0 0 20px -3px rgba(40,160,240,0.4);transition:background 0.15s}.btn-primary:hover{background:#1184d4}.btn-secondary{flex:1;padding:0.65rem 1rem;background:#090d16;color:#e2e8f0;font-weight:600;text-decoration:none;border-radius:0.5rem;font-size:0.85rem;border:1px solid rgba(40,160,240,0.25);transition:border-color 0.15s}.btn-secondary:hover{border-color:#28a0f0}</style></head><body><main class='card'><div class='logo-wrap'><svg width='44' height='44' viewBox='0 0 32 32' fill='none' style='filter:drop-shadow(0 0 10px rgba(40,160,240,0.5))'><polygon points='16,2 28,9 28,23 16,30 4,23 4,9' fill='#090D16' stroke='#28A0F0' stroke-width='1.5' stroke-linejoin='round'/><path d='M10 12 L16 8 L16 17 L10 21 Z' fill='#28A0F0'/><path d='M10 21 L16 17 L21 19.5 L15 23.5 Z' fill='#0B68AA'/><path d='M16 13 L22 9 L22 18 L16 22 Z' fill='#FFFFFF'/><path d='M16 22 L22 18 L19 16 L13 20 Z' fill='#94A3B8'/><circle cx='16' cy='16' r='1.2' fill='#28A0F0'/></svg></div><div class='badge'>Arbitrum Nitro Active-Passive L7</div><h1>DriftGuard Ingress Gateway</h1><div class='status'><span class='pulse'></span>● ALL BACKENDS OPERATIONAL</div><div class='paths'><div class='path-row'><span class='path-code'>/arb</span><span class='path-desc'>Arbitrum One Mainnet (42161)</span></div><div class='path-row'><span class='path-code'>/nova</span><span class='path-desc'>Arbitrum Nova AnyTrust (42170)</span></div><div class='path-row'><span class='path-code'>/arb-sepolia</span><span class='path-desc'>Arbitrum Sepolia Testnet (421614)</span></div><div class='path-row'><span class='path-code'>/healthz</span><span class='path-desc'>Consensus Sentinel Telemetry</span></div></div><div class='actions'><a href='https://driftguard.live/rpc' class='btn-primary'>Open RPC Playground →</a><a href='https://driftguard.live' class='btn-secondary'>View Docs &amp; Setup</a></div></main></body></html>" if is_get !is_sentinel

    # 4. Strict Method Whitelist (Only POST and OPTIONS allowed for RPC, GET allowed for Sentinel)
    acl is_post method POST
    http-request deny deny_status 405 if !is_post !is_sentinel

    # 5. Payload Guard (Reject oversized requests > 2MB)
    acl body_too_large req.body_size gt 2097152
    http-request deny deny_status 413 content-type application/json string '{"jsonrpc":"2.0","error":{"code":-32600,"message":"Payload exceeds 2MB limit"},"id":null}' if body_too_large

    # 6. Rate Limit Enforcement
    acl rate_abuser sc0_http_req_rate gt "${RATE_LIMIT_PER_10S}"
    http-request deny deny_status 429 content-type application/json string '{"jsonrpc":"2.0","error":{"code":-32005,"message":"Rate limit exceeded. Try again shortly."},"id":null}' if rate_abuser

    # 7. Path-Based Routing ACLs
    acl is_root        path -m str /
    acl is_arb         path -m str /arb || path_beg /arb/ || path -m str /arbitrum || path_beg /arbitrum/
    acl is_nova        path -m str /nova || path_beg /nova/ || path -m str /arbitrum-nova || path_beg /arbitrum-nova/
    acl is_arb_sepolia path -m str /arb-sepolia || path_beg /arb-sepolia/ || path -m str /arbitrum-sepolia || path_beg /arbitrum-sepolia/
    acl is_base        path -m str /base || path_beg /base/
    acl is_sepolia     path -m str /sepolia || path_beg /sepolia/

    # Do NOT return 404 for is_root or CORS preflights (OPTIONS) or is_sentinel
    http-request return status 404 content-type application/json string '{"error":"unknown chain route"}' if !is_arb !is_nova !is_arb_sepolia !is_base !is_sepolia !is_root !is_sentinel

    # Retain routing classification before path stripping
    http-request set-var(req.is_arb) bool(true) if is_arb
    http-request set-var(req.is_nova) bool(true) if is_nova
    http-request set-var(req.is_arb_sepolia) bool(true) if is_arb_sepolia
    http-request set-var(req.is_base) bool(true) if is_base
    http-request set-var(req.is_sepolia) bool(true) if is_sepolia
    http-request set-var(req.is_root) bool(true) if is_root

    # CRITICAL: Path stripping. Strip paths to root / before forwarding upstream
    http-request set-path / if is_arb
    http-request set-path / if is_nova
    http-request set-path / if is_arb_sepolia
    http-request set-path / if is_base
    http-request set-path / if is_sepolia

    use_backend be_sentinel    if is_sentinel
    use_backend be_nova        if { var(req.is_nova) -m bool }
    use_backend be_arb_sepolia if { var(req.is_arb_sepolia) -m bool }
    use_backend be_base        if { var(req.is_base) -m bool }
    use_backend be_sepolia     if { var(req.is_sepolia) -m bool }
    use_backend be_arb         if { var(req.is_arb) -m bool } || { var(req.is_root) -m bool }
    default_backend be_arb

# --- Base Mainnet Backend (Chain ID: 8453) ---
backend be_base
    mode http
    http-request set-header Host mainnet.base.org
    http-request set-header Host base-rpc.publicnode.com if !{ srv_is_up(be_base/primary) }
    http-response set-header X-Upstream %[srv_name]
    option httpchk POST / "{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}"
    http-check send meth POST uri / ver HTTP/1.1 hdr Host mainnet.base.org hdr Content-Type application/json body "{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}"
    http-check expect status 200
    default-server inter 3s fall 2 rise 2 ssl verify none
    server primary  mainnet.base.org:443 check check-sni mainnet.base.org sni str(mainnet.base.org)
    server fallback base-rpc.publicnode.com:443 ssl verify none sni str(base-rpc.publicnode.com) backup

# --- Arbitrum One Backend (Chain ID: 42161) ---
backend be_arb
    mode http
    http-request set-header Host arb1.arbitrum.io
    http-request set-header Host arbitrum-one-rpc.publicnode.com if !{ srv_is_up(be_arb/primary) }
    http-request set-path /rpc if { srv_is_up(be_arb/primary) }
    http-request set-path / if !{ srv_is_up(be_arb/primary) }
    http-response set-header X-Upstream %[srv_name]
    option httpchk POST / "{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}"
    http-check send meth POST uri /rpc ver HTTP/1.1 hdr Host arb1.arbitrum.io hdr Content-Type application/json body "{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}"
    http-check expect status 200,301
    default-server inter 3s fall 2 rise 2 ssl verify none
    server primary  arb1.arbitrum.io:443 check check-sni arb1.arbitrum.io sni str(arb1.arbitrum.io)
    server fallback arbitrum-one-rpc.publicnode.com:443 ssl verify none sni str(arbitrum-one-rpc.publicnode.com) backup

# --- Ethereum Sepolia Testnet Backend (Chain ID: 11155111) ---
backend be_sepolia
    mode http
    http-request set-header Host ethereum-sepolia-rpc.publicnode.com
    http-request set-header Host sepolia.gateway.tenderly.co if !{ srv_is_up(be_sepolia/primary) }
    http-response set-header X-Upstream %[srv_name]
    option httpchk POST / "{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}"
    http-check send meth POST uri / ver HTTP/1.1 hdr Host ethereum-sepolia-rpc.publicnode.com hdr Content-Type application/json body "{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}"
    http-check expect status 200
    default-server inter 3s fall 2 rise 2 ssl verify none
    server primary  ethereum-sepolia-rpc.publicnode.com:443 check check-sni ethereum-sepolia-rpc.publicnode.com sni str(ethereum-sepolia-rpc.publicnode.com)
    server fallback sepolia.gateway.tenderly.co:443 ssl verify none sni str(sepolia.gateway.tenderly.co) backup

# --- Arbitrum Nova Backend (Chain ID: 42170) ---
backend be_nova
    mode http
    http-request set-header Host nova.arbitrum.io
    http-request set-header Host arbitrum-nova-rpc.publicnode.com if !{ srv_is_up(be_nova/primary) }
    http-request set-path /rpc if { srv_is_up(be_nova/primary) }
    http-request set-path / if !{ srv_is_up(be_nova/primary) }
    http-response set-header X-Upstream %[srv_name]
    option httpchk POST / "{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}"
    http-check send meth POST uri /rpc ver HTTP/1.1 hdr Host nova.arbitrum.io hdr Content-Type application/json body "{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}"
    http-check expect status 200,301
    default-server inter 3s fall 2 rise 2 ssl verify none
    server primary  nova.arbitrum.io:443 check check-sni nova.arbitrum.io sni str(nova.arbitrum.io)
    server fallback arbitrum-nova-rpc.publicnode.com:443 ssl verify none sni str(arbitrum-nova-rpc.publicnode.com) backup

# --- Arbitrum Sepolia Backend (Chain ID: 421614) ---
backend be_arb_sepolia
    mode http
    http-request set-header Host sepolia-rollup.arbitrum.io
    http-request set-header Host arbitrum-sepolia-rpc.publicnode.com if !{ srv_is_up(be_arb_sepolia/primary) }
    http-request set-path /rpc if { srv_is_up(be_arb_sepolia/primary) }
    http-request set-path / if !{ srv_is_up(be_arb_sepolia/primary) }
    http-response set-header X-Upstream %[srv_name]
    option httpchk POST / "{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}"
    http-check send meth POST uri /rpc ver HTTP/1.1 hdr Host sepolia-rollup.arbitrum.io hdr Content-Type application/json body "{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}"
    http-check expect status 200,301
    default-server inter 3s fall 2 rise 2 ssl verify none
    server primary  sepolia-rollup.arbitrum.io:443 check check-sni sepolia-rollup.arbitrum.io sni str(sepolia-rollup.arbitrum.io)
    server fallback arbitrum-sepolia-rpc.publicnode.com:443 ssl verify none sni str(arbitrum-sepolia-rpc.publicnode.com) backup

# --- DriftGuard Sentinel API Backend ---
backend be_sentinel
    mode http
    server sentinel sentinel:8000 check resolvers docker_dns resolve-prefer ipv4


