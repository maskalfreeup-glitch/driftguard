global
    log stdout format raw local0 info
    maxconn 4096
    user haproxy
    group haproxy
    stats socket /run/haproxy/admin.sock mode 666 level admin
    tune.ssl.default-dh-param 2048

# Dynamic Docker DNS resolver for runtime container discovery
resolvers docker_dns
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold other 30s

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  http-server-close
    option  forwardfor
    compression algo gzip
    compression type application/json text/plain text/html
    timeout connect 5000ms
    timeout client  30000ms
    timeout server  30000ms
    timeout http-request 10000ms
    timeout http-keep-alive 5000ms
    default-server init-addr libc,none

# --- HAProxy Observability & Prometheus Metrics ---
frontend stats_and_metrics
    bind *:"${HAPROXY_STATS_PORT}"
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 5s
    stats auth "${STATS_USER}:${STATS_PASSWORD}"

# --- Inbound Multi-Chain EVM JSON-RPC Gateway ---
frontend fe_eth_rpc
    bind *:"${GATEWAY_PORT}"


    # 1. Anti-Abuse Rate Limiting (Track per-IP request rate, prioritizing edge proxy headers)
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 req.hdr_ip(CF-Connecting-IP) if { req.hdr(CF-Connecting-IP) -m found }
    http-request track-sc0 req.hdr_ip(X-Forwarded-For) if !{ req.hdr(CF-Connecting-IP) -m found } { req.hdr(X-Forwarded-For) -m found }
    http-request track-sc0 src if !{ req.hdr(CF-Connecting-IP) -m found } !{ req.hdr(X-Forwarded-For) -m found }

    # 2. CORS Preflight & Response Headers
    http-response set-header Access-Control-Allow-Origin "https://driftguard.live"
    http-response set-header Access-Control-Allow-Methods "POST, OPTIONS, GET"
    http-response set-header Access-Control-Allow-Headers "Content-Type"
    http-response set-header X-DriftGuard-Gateway "HAProxy-L7"

    http-after-response set-header Access-Control-Allow-Origin "https://driftguard.live"
    http-after-response set-header Access-Control-Allow-Methods "POST, OPTIONS, GET"
    http-after-response set-header Access-Control-Allow-Headers "Content-Type"
    http-after-response set-header X-DriftGuard-Gateway "HAProxy-L7"
    
    acl is_options method OPTIONS
    http-request return status 204 hdr Access-Control-Allow-Origin "https://driftguard.live" hdr Access-Control-Allow-Methods "POST, OPTIONS, GET" hdr Access-Control-Allow-Headers "Content-Type" if is_options

    # 3. Browser Traffic Redirect & Sentinel Endpoints
    acl is_browser hdr_sub(Accept) -i text/html
    acl is_root path -i /
    http-request redirect location https://driftguard.live/rpc code 302 if is_browser is_root

    acl is_sentinel    path -m str /healthz || path_beg /healthz/ || path -m str /status || path_beg /status/
    acl is_get method GET
    http-request return status 200 content-type text/html lf-string "<!doctype html><html><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>DriftGuard RPC Gateway</title><style>body{margin:0;background:#0b1020;color:#e5e7eb;font:16px system-ui,sans-serif;display:grid;min-height:100vh;place-items:center}.card{padding:2.5rem;border:1px solid #26324b;border-radius:1rem;background:#111a2e;max-width:38rem}h1{margin-top:0;color:#7dd3fc}.status{color:#86efac;font-weight:700}small{color:#9ca3af}</style></head><body><main class=card><h1>DriftGuard RPC Gateway</h1><p>Unified Multi-Chain Active-Passive Gateway for EVM Networks</p><p class=status>● SYSTEM OPERATIONAL</p><p>Supported Networks: Base (/base), Arbitrum (/arb), Sepolia (/sepolia)</p><small>JSON-RPC requests are accepted at these endpoints via HTTP POST.</small></main></body></html>" if is_get !is_sentinel

    # 4. Strict Method Whitelist (Only POST and OPTIONS allowed for RPC, GET allowed for Sentinel)
    acl is_post method POST
    http-request deny deny_status 405 if !is_post !is_sentinel

    # 5. Payload Guard (Reject oversized requests > 2MB)
    acl body_too_large req.body_size gt 2097152
    http-request deny deny_status 413 content-type application/json string '{"jsonrpc":"2.0","error":{"code":-32600,"message":"Payload exceeds 2MB limit"},"id":null}' if body_too_large

    # 6. Rate Limit Enforcement
    acl rate_abuser sc0_http_req_rate gt "${RATE_LIMIT_PER_10S}"
    http-request deny deny_status 429 content-type application/json string '{"jsonrpc":"2.0","error":{"code":-32005,"message":"Rate limit exceeded. Try again shortly."},"id":null}' if rate_abuser

    # 7. Path-Based Routing ACLs
    acl is_root        path -m str /
    acl is_arb         path -m str /arb || path_beg /arb/ || path -m str /arbitrum || path_beg /arbitrum/
    acl is_nova        path -m str /nova || path_beg /nova/ || path -m str /arbitrum-nova || path_beg /arbitrum-nova/
    acl is_arb_sepolia path -m str /arb-sepolia || path_beg /arb-sepolia/ || path -m str /arbitrum-sepolia || path_beg /arbitrum-sepolia/
    acl is_base        path -m str /base || path_beg /base/
    acl is_sepolia     path -m str /sepolia || path_beg /sepolia/

    # Do NOT return 404 for is_root or CORS preflights (OPTIONS) or is_sentinel
    http-request return status 404 content-type application/json string '{"error":"unknown chain route"}' if !is_arb !is_nova !is_arb_sepolia !is_base !is_sepolia !is_root !is_sentinel

    # Retain routing classification before path stripping
    http-request set-var(req.is_arb) bool(true) if is_arb
    http-request set-var(req.is_nova) bool(true) if is_nova
    http-request set-var(req.is_arb_sepolia) bool(true) if is_arb_sepolia
    http-request set-var(req.is_base) bool(true) if is_base
    http-request set-var(req.is_sepolia) bool(true) if is_sepolia
    http-request set-var(req.is_root) bool(true) if is_root

    # CRITICAL: Path stripping. Strip paths to root / before forwarding upstream
    http-request set-path / if is_arb
    http-request set-path / if is_nova
    http-request set-path / if is_arb_sepolia
    http-request set-path / if is_base
    http-request set-path / if is_sepolia

    use_backend be_sentinel    if is_sentinel
    use_backend be_nova        if { var(req.is_nova) -m bool }
    use_backend be_arb_sepolia if { var(req.is_arb_sepolia) -m bool }
    use_backend be_base        if { var(req.is_base) -m bool }
    use_backend be_sepolia     if { var(req.is_sepolia) -m bool }
    use_backend be_arb         if { var(req.is_arb) -m bool } || { var(req.is_root) -m bool }
    default_backend be_arb

# --- Base Mainnet Backend (Chain ID: 8453) ---
backend be_base
    mode http
    http-request set-header Host mainnet.base.org
    http-request set-header Host base-rpc.publicnode.com if !{ srv_is_up(be_base/primary) }
    http-response set-header X-Upstream %[srv_name]
    option httpchk POST / "{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}"
    http-check send meth POST uri / ver HTTP/1.1 hdr Host mainnet.base.org hdr Content-Type application/json body "{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}"
    http-check expect status 200
    default-server inter 3s fall 2 rise 2 ssl verify none
    server primary  mainnet.base.org:443 check check-sni mainnet.base.org sni str(mainnet.base.org)
    server fallback base-rpc.publicnode.com:443 ssl verify none sni str(base-rpc.publicnode.com) backup

# --- Arbitrum One Backend (Chain ID: 42161) ---
backend be_arb
    mode http
    http-request set-header Host arb1.arbitrum.io
    http-request set-header Host arbitrum-one-rpc.publicnode.com if !{ srv_is_up(be_arb/primary) }
    http-request set-path /rpc if { srv_is_up(be_arb/primary) }
    http-request set-path / if !{ srv_is_up(be_arb/primary) }
    http-response set-header X-Upstream %[srv_name]
    option httpchk POST / "{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}"
    http-check send meth POST uri /rpc ver HTTP/1.1 hdr Host arb1.arbitrum.io hdr Content-Type application/json body "{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}"
    http-check expect status 200,301
    default-server inter 3s fall 2 rise 2 ssl verify none
    server primary  arb1.arbitrum.io:443 check check-sni arb1.arbitrum.io sni str(arb1.arbitrum.io)
    server fallback arbitrum-one-rpc.publicnode.com:443 ssl verify none sni str(arbitrum-one-rpc.publicnode.com) backup

